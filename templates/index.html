<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestOne • AI Audio-Visual Dialogue Frame Locator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f4ff',
              100: '#dbe4ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            accent: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 3s linear infinite',
            'gradient': 'gradient 8s ease infinite',
          },
          keyframes: {
            gradient: {
              '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
              '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-interactive {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card-interactive:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.2);
    }
    .glow-effect {
      box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.35);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Background Lights -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-40 left-1/4 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-20 w-96 h-96 bg-sky-500/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-20 left-1/3 w-[30rem] h-[30rem] bg-purple-600/10 rounded-full blur-3xl"></div>
  </div>

  <div id="root" class="relative z-10"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PRESETS = [
      {
        title: "Sherlock Holmes (ok.ru re-upload)",
        url: "https://youtu.be/NPX39xzhtr8",
        dialogue: "My mind rebels at stagnation",
        tag: "Target Task"
      },
      {
        title: "Rick Astley - Never Gonna Give You Up",
        url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        dialogue: "Never gonna give you up",
        tag: "Music Video"
      }
    ];

    function App() {
      const [videoUrl, setVideoUrl] = useState("https://youtu.be/NPX39xzhtr8");
      const [targetDialogue, setTargetDialogue] = useState("My mind rebels at stagnation");
      const [status, setStatus] = useState("idle"); // idle | running | completed | error
      const [progress, setProgress] = useState(0);
      const [progressMessage, setProgressMessage] = useState("");
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);
      const [imageTimestamp, setImageTimestamp] = useState(Date.now());
      const pollTimerRef = useRef(null);

      // Poll status when running
      useEffect(() => {
        if (status === "running") {
          pollTimerRef.current = setInterval(async () => {
            try {
              const res = await fetch("/api/status");
              if (!res.ok) return;
              const data = await res.json();

              setProgress(data.progress || 0);
              setProgressMessage(data.message || "");

              if (data.status === "completed") {
                setStatus("completed");
                setResult(data.result);
                setError(null);
                setImageTimestamp(Date.now());
                clearInterval(pollTimerRef.current);
              } else if (data.status === "error") {
                setStatus("error");
                setError(data.error || "An unexpected error occurred during processing.");
                clearInterval(pollTimerRef.current);
              }
            } catch (err) {
              console.error("Polling error:", err);
            }
          }, 1000);
        } else {
          if (pollTimerRef.current) clearInterval(pollTimerRef.current);
        }

        return () => {
          if (pollTimerRef.current) clearInterval(pollTimerRef.current);
        };
      }, [status]);

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        if (!videoUrl.trim() || !targetDialogue.trim()) {
          setError("Please provide both a valid video URL and target dialogue text.");
          return;
        }

        setError(null);
        setResult(null);
        setStatus("running");
        setProgress(5);
        setProgressMessage("Sending request to backend pipeline...");

        try {
          const res = await fetch("/api/process", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              video_url: videoUrl.trim(),
              target_dialogue: targetDialogue.trim()
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || `Server responded with status ${res.status}`);
          }
        } catch (err) {
          setStatus("error");
          setError(err.message || "Failed to start extraction pipeline.");
        }
      };

      const handleCopyResult = () => {
        if (!result || !result.formatted_output) return;
        navigator.clipboard.writeText(result.formatted_output).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2200);
        });
      };

      const handleApplyPreset = (preset) => {
        setVideoUrl(preset.url);
        setTargetDialogue(preset.dialogue);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8 max-w-6xl mx-auto">
          {/* Header */}
          <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-800/80">
            <div className="flex items-center space-x-3">
              <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl sm:text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                    QuestOne
                  </h1>
                  <span className="px-2 py-0.5 text-xs font-semibold rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    Dialogue Locator
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-slate-400">
                  Precision audio-visual speech alignment & frame extraction
                </p>
              </div>
            </div>

            {/* Badges */}
            <div className="flex flex-wrap items-center gap-2">
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                OpenAI Whisper
              </span>
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300">
                <span className="w-2 h-2 rounded-full bg-sky-400"></span>
                OpenCV Sharpness
              </span>
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300">
                <span className="w-2 h-2 rounded-full bg-purple-400"></span>
                Rapidfuzz Matching
              </span>
            </div>
          </header>

          {/* Main Content Grid */}
          <main className="grid grid-cols-1 lg:grid-cols-12 gap-8 my-8 items-start">
            
            {/* Left Column: Form & Presets */}
            <div className="lg:col-span-6 space-y-6">
              <div className="glass-card rounded-2xl p-6 sm:p-7 shadow-xl">
                <div className="flex items-center justify-between mb-5">
                  <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                    <svg className="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    Input Parameters
                  </h2>
                  <span className="text-xs text-slate-400">Enter stream & dialogue</span>
                </div>

                {/* ok.ru Re-upload Notice Banner */}
                <div className="mb-5 p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200/90 text-xs flex items-start gap-2.5">
                  <svg className="w-4 h-4 text-amber-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <div className="leading-relaxed">
                    <span className="font-semibold text-amber-300">Notice: </span>
                    The <span className="font-mono text-[11px] bg-amber-500/20 px-1 py-0.5 rounded text-amber-200">ok.ru</span> video has been downloaded and uploaded to YouTube (<a href="https://youtu.be/NPX39xzhtr8" target="_blank" rel="noreferrer" className="underline text-sky-400 hover:text-sky-300 font-mono">https://youtu.be/NPX39xzhtr8</a>) since <span className="font-mono text-[11px]">ok.ru</span> blocks direct requests.
                  </div>
                </div>

                <form onSubmit={handleSubmit} className="space-y-5">
                  {/* Video URL Input */}
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Video Stream URL
                      </label>
                      <button
                        type="button"
                        onClick={() => setVideoUrl("https://youtu.be/NPX39xzhtr8")}
                        className="text-[11px] text-indigo-400 hover:text-indigo-300 transition-colors"
                      >
                        Reset to Default
                      </button>
                    </div>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                        </svg>
                      </div>
                      <input
                        type="url"
                        value={videoUrl}
                        onChange={(e) => setVideoUrl(e.target.value)}
                        placeholder="https://youtu.be/NPX39xzhtr8"
                        required
                        disabled={status === "running"}
                        className="w-full pl-10 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all font-mono text-xs"
                      />
                    </div>
                  </div>

                  {/* Target Dialogue Input */}
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                      Target Dialogue Text
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                        </svg>
                      </div>
                      <input
                        type="text"
                        value={targetDialogue}
                        onChange={(e) => setTargetDialogue(e.target.value)}
                        placeholder='e.g., "Never gonna give you up" or "My mind rebels at stagnation"'
                        required
                        disabled={status === "running"}
                        className="w-full pl-10 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all"
                      />
                    </div>
                  </div>

                  {/* Submit Button */}
                  <button
                    type="submit"
                    disabled={status === "running"}
                    className={`w-full relative overflow-hidden py-3.5 px-6 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2.5 shadow-lg ${
                      status === "running"
                        ? "bg-slate-800 text-slate-400 cursor-not-allowed border border-slate-700"
                        : "bg-gradient-to-r from-indigo-600 via-indigo-500 to-sky-500 hover:from-indigo-500 hover:to-sky-400 text-white shadow-indigo-500/25 hover:shadow-indigo-500/40 active:scale-[0.99]"
                    }`}
                  >
                    {status === "running" ? (
                      <>
                        <svg className="animate-spin w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Locating Dialogue & Frame...</span>
                      </>
                    ) : (
                      <>
                        <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Run Extraction Pipeline</span>
                      </>
                    )}
                  </button>
                </form>

                {/* Preset Suggestions */}
                <div className="mt-6 pt-5 border-t border-slate-800/80">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 block">
                    Quick Dialogue Presets
                  </span>
                  <div className="space-y-2">
                    {PRESETS.map((preset, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleApplyPreset(preset)}
                        disabled={status === "running"}
                        className="w-full text-left p-2.5 rounded-lg bg-slate-950/40 hover:bg-slate-800/60 border border-slate-800/60 hover:border-indigo-500/30 transition-all flex items-center justify-between group"
                      >
                        <div className="truncate mr-2">
                          <div className="text-xs font-medium text-slate-200 group-hover:text-indigo-300">
                            "{preset.dialogue}"
                          </div>
                          <div className="text-[11px] text-slate-500 truncate">
                            {preset.title}
                          </div>
                        </div>
                        <span className="shrink-0 text-[10px] px-2 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-400 group-hover:text-indigo-400 group-hover:border-indigo-500/20">
                          {preset.tag}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Pipeline Progress Indicator */}
              {(status === "running" || status === "completed" || status === "error") && (
                <div className="glass-card rounded-2xl p-5 shadow-lg border border-slate-800">
                  <div className="flex items-center justify-between text-xs font-medium mb-2">
                    <span className="flex items-center gap-2 text-slate-300">
                      {status === "running" && <span className="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>}
                      {status === "completed" && <span className="w-2 h-2 rounded-full bg-emerald-500"></span>}
                      {status === "error" && <span className="w-2 h-2 rounded-full bg-rose-500"></span>}
                      {progressMessage || "Processing..."}
                    </span>
                    <span className="font-mono text-indigo-400">{progress}%</span>
                  </div>
                  
                  {/* Progress Bar */}
                  <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                    <div
                      className={`h-full transition-all duration-500 ease-out ${
                        status === "error"
                          ? "bg-rose-500"
                          : "bg-gradient-to-r from-indigo-600 via-sky-500 to-emerald-400"
                      }`}
                      style={{ width: `${progress}%` }}
                    ></div>
                  </div>

                  {/* Pipeline Steps */}
                  <div className="grid grid-cols-4 gap-2 mt-4 text-center">
                    <div className={`p-2 rounded-lg text-[10px] font-medium border ${
                      progress >= 20 ? "bg-indigo-500/10 border-indigo-500/30 text-indigo-300" : "bg-slate-950/40 border-slate-800 text-slate-500"
                    }`}>
                      1. Download
                    </div>
                    <div className={`p-2 rounded-lg text-[10px] font-medium border ${
                      progress >= 50 ? "bg-indigo-500/10 border-indigo-500/30 text-indigo-300" : "bg-slate-950/40 border-slate-800 text-slate-500"
                    }`}>
                      2. Audio ASR
                    </div>
                    <div className={`p-2 rounded-lg text-[10px] font-medium border ${
                      progress >= 85 ? "bg-indigo-500/10 border-indigo-500/30 text-indigo-300" : "bg-slate-950/40 border-slate-800 text-slate-500"
                    }`}>
                      3. Frame Scan
                    </div>
                    <div className={`p-2 rounded-lg text-[10px] font-medium border ${
                      progress >= 100 ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300" : "bg-slate-950/40 border-slate-800 text-slate-500"
                    }`}>
                      4. Result
                    </div>
                  </div>
                </div>
              )}

              {/* Error Alert */}
              {error && (
                <div className="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-start gap-3">
                  <svg className="w-5 h-5 shrink-0 text-rose-400 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <div>
                    <strong className="font-semibold block">Execution Error</strong>
                    <span className="text-xs text-rose-300/80">{error}</span>
                  </div>
                </div>
              )}
            </div>

            {/* Right Column: Output Format & Visual Frame Result */}
            <div className="lg:col-span-6 space-y-6">
              
              {/* Expected Format Output Card */}
              <div className="glass-card rounded-2xl p-6 sm:p-7 shadow-xl relative overflow-hidden">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full bg-emerald-400"></div>
                    <h2 className="text-sm font-bold uppercase tracking-wider text-slate-200">
                      Standard Pipeline Output
                    </h2>
                  </div>
                  {result && (
                    <button
                      onClick={handleCopyResult}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 hover:border-indigo-500/50 transition-all active:scale-95"
                    >
                      {copied ? (
                        <>
                          <svg className="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                          </svg>
                          <span className="text-emerald-400">Copied!</span>
                        </>
                      ) : (
                        <>
                          <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                          </svg>
                          <span>Copy Output</span>
                        </>
                      )}
                    </button>
                  )}
                </div>

                {/* Formatted Code Block */}
                <div className="relative bg-slate-950 border border-slate-800/80 rounded-xl p-5 font-mono text-sm leading-relaxed overflow-x-auto custom-scrollbar">
                  {result ? (
                    <div className="space-y-1.5">
                      <div className="text-emerald-400">
                        <span className="text-slate-500 select-none">Timestamp : </span>
                        <span className="font-semibold">{result.timestamp_formatted}</span>
                      </div>
                      <div className="text-sky-400">
                        <span className="text-slate-500 select-none">Frame     : </span>
                        <span className="font-semibold">{result.frame_number}</span>
                      </div>
                      <div className="text-amber-300">
                        <span className="text-slate-500 select-none">Text      : </span>
                        <span className="font-semibold">"{result.text}"</span>
                      </div>
                    </div>
                  ) : (
                    <div className="text-slate-500 text-xs py-4 space-y-1 font-mono">
                      <div>Timestamp : HH:MM:SS.sss</div>
                      <div>Frame     : &lt;Frame number&gt;</div>
                      <div>Text      : "{targetDialogue || 'My mind rebels at stagnation'}"</div>
                      <div className="pt-2 text-[11px] text-slate-600 italic font-sans">
                        (Awaiting pipeline execution...)
                      </div>
                    </div>
                  )}
                </div>

                {/* Stat Badges */}
                {result && (
                  <div className="grid grid-cols-3 gap-3 mt-4">
                    <div className="p-3 rounded-xl bg-slate-950/60 border border-slate-800 text-center">
                      <div className="text-[10px] uppercase font-semibold text-slate-500">Match Score</div>
                      <div className="text-base font-bold text-indigo-400">{result.score}%</div>
                    </div>
                    <div className="p-3 rounded-xl bg-slate-950/60 border border-slate-800 text-center">
                      <div className="text-[10px] uppercase font-semibold text-slate-500">Raw Seconds</div>
                      <div className="text-base font-bold text-sky-400">{result.timestamp_seconds}s</div>
                    </div>
                    <div className="p-3 rounded-xl bg-slate-950/60 border border-slate-800 text-center">
                      <div className="text-[10px] uppercase font-semibold text-slate-500">Sharpness</div>
                      <div className="text-base font-bold text-emerald-400">{result.sharpness_score}</div>
                    </div>
                  </div>
                )}
              </div>

              {/* Extracted Frame Preview Card */}
              <div className="glass-card rounded-2xl p-6 sm:p-7 shadow-xl">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-sm font-bold uppercase tracking-wider text-slate-200 flex items-center gap-2">
                    <svg className="w-4 h-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    Optimal Extracted Frame
                  </h2>
                  {result && (
                    <a
                      href={`/api/frame?t=${imageTimestamp}`}
                      download={`frame_${result.frame_number}.png`}
                      className="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 transition-colors"
                    >
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                      </svg>
                      Download PNG
                    </a>
                  )}
                </div>

                <div className="relative rounded-xl overflow-hidden bg-slate-950 border border-slate-800 aspect-video flex items-center justify-center group">
                  {result ? (
                    <>
                      <img
                        src={`/api/frame?t=${imageTimestamp}`}
                        alt="Extracted Optimal Frame"
                        className="w-full h-full object-contain transition-transform duration-300 group-hover:scale-[1.02]"
                      />
                      <div className="absolute bottom-3 left-3 px-2.5 py-1 rounded-md bg-slate-950/80 backdrop-blur-md border border-slate-700/80 text-[11px] font-mono text-slate-200">
                        ⏱️ {result.timestamp_formatted} • Frame #{result.frame_number}
                      </div>
                    </>
                  ) : (
                    <div className="text-center p-6 text-slate-600">
                      <svg className="w-12 h-12 mx-auto mb-2 opacity-40 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                      </svg>
                      <p className="text-xs">No frame extracted yet.</p>
                      <p className="text-[11px] text-slate-500 mt-1">Submit a URL & dialogue to display the sharpness-optimized frame.</p>
                    </div>
                  )}
                </div>
              </div>

            </div>
          </main>

          {/* Footer */}
          <footer className="pt-6 pb-2 border-t border-slate-900 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div>
              QuestOne Audio-Visual Processing Engine • Built with React 18 & Tailwind CSS
            </div>
            <div className="font-mono text-[11px] text-slate-600">
              Output Format: Timestamp : HH:MM:SS.sss | Frame : &lt;N&gt; | Text : "..."
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
